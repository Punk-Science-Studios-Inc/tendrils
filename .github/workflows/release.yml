# Publish a release from a version tag.
#
#   git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0
#
# GoReleaser stamps the tag into both binaries, builds every platform, writes
# checksums.txt, and creates the GitHub Release the installers download from.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # required to create the release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # GoReleaser derives the changelog from history

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
